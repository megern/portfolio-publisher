[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-publisher"
version = "1.0.0"
description = "Evidence-pinned local content drafts"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.urls]
Repository = "https://github.com/megern/portfolio-publisher"
Issues = "https://github.com/megern/portfolio-publisher/issues"

[project.scripts]
portfolio-review = "portfolio:main"
portfolio-publisher = "publisher:main"

[tool.setuptools]
py-modules = ["portfolio", "portfolio_report_bundle", "publisher"]

